---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: "v1.1.2"

  # The tags e2e-images builds under and every leg pushes to its own
  # runner-local registry. The nodes pull the registry.e2e names instead (see
  # the go-e2e env), which the Talos mirror in patches/registry.yaml points at
  # port 5000 on the bridge gateway. The split matters beyond taste: test.sh
  # splits *_IMAGE on ':' for the Helm repo and tag, so the host:port push form
  # would parse wrong there.
  PUSH_CONTROLLER_IMAGE: localhost:5000/miroir-controller:e2e
  PUSH_AGENT_IMAGE: localhost:5000/miroir-agent:e2e
  PUSH_GATEWAY_IMAGE: localhost:5000/miroir-gateway:e2e

jobs:
  docs:
    if: ${{ github.event_name != 'push' }}
    name: Docs
    uses: $/.github/workflows/docs.yaml
    permissions:
      contents: read
    with:
      deploy: false

  # Built once and handed to every e2e leg, so they all install identical bytes
  # instead of six builds racing one GHA cache scope apiece.
  e2e-images:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: E2E Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing here runs a pinned tool; the builds happen inside Docker and
      # only the Go version is read back out of the config.
      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false

      - name: Resolve toolchain versions
        id: tools
        run: echo "go=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # load: true rather than a push, so one docker save can export all three
      # at once and share the layers gateway inherits from agent. One writer per
      # scope now, so each cache-to is unconditional.
      - name: Build controller image
        id: controller-image
        background: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          target: controller
          tags: ${{ env.PUSH_CONTROLLER_IMAGE }}
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha,scope=e2e-controller
          cache-to: type=gha,mode=max,scope=e2e-controller

      - name: Build agent image
        id: agent-image
        background: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          target: agent
          tags: ${{ env.PUSH_AGENT_IMAGE }}
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha,scope=e2e-agent
          cache-to: type=gha,mode=max,scope=e2e-agent

      # Gateway extends the agent stage, so buildx reuses it and only layers on
      # the ganesha packages.
      - name: Build gateway image
        id: gateway-image
        background: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          target: gateway
          tags: ${{ env.PUSH_GATEWAY_IMAGE }}
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha,scope=e2e-gateway
          cache-to: type=gha,mode=max,scope=e2e-gateway

      - wait: [controller-image, agent-image, gateway-image]

      # One tarball for all three: gateway shares every agent layer, so saving
      # them together is barely larger than the agent alone. gzip because the
      # daemon may export layers uncompressed depending on its image store, and
      # docker load reads either. shell: bash for the pipefail the implicit
      # `bash -e` default lacks -- a failed save would otherwise leave gzip's
      # exit status to pass the step and hand every leg a truncated tarball.
      - name: Export the images
        shell: bash
        run: |
          docker save \
            "${PUSH_CONTROLLER_IMAGE}" "${PUSH_AGENT_IMAGE}" "${PUSH_GATEWAY_IMAGE}" \
            | gzip -1 > "${RUNNER_TEMP}/e2e-images.tar.gz"

      - name: Upload the images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images.tar.gz
          retention-days: 1

  go-e2e:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go E2E (${{ matrix.suite }})
    needs: e2e-images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # The legs are independent clusters on their own runners, so a failure in one
      # should not cost us the signal from the other.
      fail-fast: false
      matrix:
        include:
          # miroir's own Go specs against the local (lvmthin, replicas:1) class.
          # Its own leg because run back to back with the upstream suite below
          # they made a single 38-minute lane, and neither needs the other's
          # state -- a fresh cluster costs ~6 minutes, the split saves ~14.
          - suite: specs
            testdriver: testdriver-local.yaml
            specs: "1"
            conformance: "0"
            capacity: "true"
          # The upstream external-storage suite against that same local class.
          - suite: local
            testdriver: testdriver-local.yaml
            capacity: "true"
          # The upstream suite against the replicated (DRBD, replicas:2) class,
          # group snapshots included.
          - suite: replicated
            testdriver: testdriver.yaml
          - suite: zfs
            testdriver: testdriver-zfs.yaml
            capacity: "true"
          # Filesystem-only multi-node access through the NFS gateway. Keeping this
          # separate avoids advertising unsupported raw-block RWX.
          - suite: rwx
            testdriver: testdriver-rwx.yaml
            gateway: "true"
            capacity: "true"
            focus: "miroir.home-operations.com.*(ROX mode|concurrently access the single volume from pods on different node)"
          # Serial specs need exclusive use of their cluster. The focus keeps this
          # lane on upstream [Serial] coverage instead of replaying the parallel set.
          - suite: serial
            testdriver: testdriver.yaml
            procs: "1"
            focus: 'miroir.home-operations.com.*\[Serial\]'
            skip: '\[Disruptive\]|should not mount / map unused volumes'
          # Auto-diskful needs what no other leg has: a third storage worker, so a
          # 2-replica volume gets a diskless tie-breaker to convert, and a
          # controller installed with the conversion enabled. One Go spec drives
          # the whole leg, so it skips the upstream suite.
          - suite: autodiskful
            cluster: cluster-spare.yaml
            testdriver: testdriver.yaml
            specs: "1"
            specLabels: autodiskful
            # The clock starts at NodeStageVolume, so the threshold has to
            # outlast the consumer pod's own startup with room to spare —
            # the spec asserts the leg is still diskless once that pod is up.
            autoDiskfulAfter: 2m
            conformance: "0"
    env:
      # What the chart is pointed at, and so what the nodes pull: the other half
      # of the two-names-for-one-image split described on the PUSH_* vars above.
      CONTROLLER_IMAGE: registry.e2e/miroir-controller:e2e
      AGENT_IMAGE: registry.e2e/miroir-agent:e2e
      GATEWAY_IMAGE: registry.e2e/miroir-gateway:e2e
      # test.sh packages the chart, pushes it here, and installs it back over OCI, so
      # the run exercises the distributed artifact rather than the working tree.
      CHART_REGISTRY: oci://localhost:5000/charts
    defaults:
      run:
        working-directory: test/e2e-qemu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Resolve toolchain versions
        id: tools
        working-directory: .
        run: echo "talos=$(mise config get tools.talos)" >> "$GITHUB_OUTPUT"

      # Host prep is ours to do: the cluster action provisions and nothing else.
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Enable swap
        run: |
          sudo fallocate -l 12G /mnt/e2e-swapfile
          sudo chmod 600 /mnt/e2e-swapfile
          sudo mkswap /mnt/e2e-swapfile
          sudo swapon /mnt/e2e-swapfile

      # Only the legs that set RUN_SPECS compile Go; the rest drive a prebuilt
      # e2e.test and need nothing from the module cache.
      - name: Cache Go modules and build
        if: ${{ matrix.specs == '1' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Start image registry
        run: docker run -d --name e2e-registry -p 5000:5000 registry:3

      # Booting the VMs and filling the registry share no inputs, so they overlap
      # the way the builds this leg used to run did. talosctl comes from mise,
      # whose shim the action unwraps itself, because the QEMU provisioner runs
      # under sudo.
      - name: Create cluster
        id: cluster
        background: true
        uses: home-operations/talosctl-cluster-action@9181b206f3e87c685ef63f53bbf5dc25ed45e85a # v0.2.1
        with:
          config: test/e2e-qemu/${{ matrix.cluster || 'cluster.yaml' }}
          cache: true

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-images
          path: ${{ runner.temp }}

      # Straight into this leg's own registry, so the nodes still pull over
      # loopback and nothing crosses the internet.
      - name: Load the images into the registry
        run: |
          docker load -i "${RUNNER_TEMP}/e2e-images.tar.gz"
          docker push "${PUSH_CONTROLLER_IMAGE}"
          docker push "${PUSH_AGENT_IMAGE}"
          docker push "${PUSH_GATEWAY_IMAGE}"

      - wait: [cluster]

      - name: Cache conformance test binaries
        if: ${{ matrix.conformance != '0' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/conformance/.bin
          key: conformance-bin-${{ steps.tools.outputs.talos }}

      - name: Run ${{ matrix.suite }} suite
        run: mise exec --locked --no-deps -- ./test.sh
        env:
          TESTDRIVER: ${{ matrix.testdriver }}
          RUN_SPECS: ${{ matrix.specs }}
          SPEC_LABELS: ${{ matrix.specLabels || '!autodiskful' }}
          RUN_CONFORMANCE: ${{ matrix.conformance || '1' }}
          AUTO_DISKFUL_AFTER: ${{ matrix.autoDiskfulAfter }}
          GATEWAY_ENABLED: ${{ matrix.gateway || 'false' }}
          STORAGE_CAPACITY_ENABLED: ${{ matrix.capacity || 'false' }}
          CLUSTER_NAME: ${{ steps.cluster.outputs.cluster-name }}
          ENDPOINT: ${{ steps.cluster.outputs.endpoint }}
          KUBECONFIG: ${{ steps.cluster.outputs.kubeconfig }}
          TALOSCONFIG: ${{ steps.cluster.outputs.talosconfig }}
          PROCS: ${{ matrix.procs || '4' }}
          FOCUS: ${{ matrix.focus }}
          SKIP: ${{ matrix.skip }}
          VERBOSE: "1"

      - name: Diagnostics
        if: failure()
        run: mise exec --locked --no-deps -- ./diagnostics.sh
        env:
          KUBECONFIG: ${{ steps.cluster.outputs.kubeconfig }}
          TALOSCONFIG: ${{ steps.cluster.outputs.talosconfig }}

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report-${{ matrix.suite }}
          path: test/conformance/report
          if-no-files-found: ignore

  go-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # This cache holds analyzer facts (staticcheck's "does this call
      # return?"), so a stale or partial entry does not just cost time -- it
      # turns checks like SA5011 into false positives on untouched code. Hence
      # the lock file in the key, so a golangci-lint or Go bump starts fresh
      # rather than inheriting the previous binary's facts, and no restore-keys:
      # a miss must start cold instead of falling back to the newest entry
      # under the prefix, which is how one bad entry outlives its own commit.
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('go.sum', '.golangci.yml', '.mise/mise.lock') }}

      - name: Run linter
        run: mise run lint

  go-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Running Unit Tests
        run: mise run test

      # envtest apiserver: the only place CRD structural schemas and CEL
      # validation rules are actually enforced.
      - name: Running Integration Tests
        run: mise run test-integration

      - name: Running CSI Sanity Tests
        run: mise run test-sanity

  go-vulncheck:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Vulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Run govulncheck
        run: mise run vulncheck

  helm-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Run helm lint
        run: mise run helm-lint

      - name: Check generated chart files are current
        run: mise run helm-docs-check

  helm-unittest:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Unittest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Run helm unit tests
        run: |-
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" --verify=false
          mise run helm-test

  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false

      - name: Resolve linter versions
        id: tools
        run: |
          echo "actionlint=$(mise config get tools.actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise config get tools.zizmor)" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        uses: home-operations/.github/actions/workflow-lint@69cad1e407df8070dd9cfc3314551e473544014e # workflow-lint-v1.0.3
        with:
          actionlint-version: ${{ steps.tools.outputs.actionlint }}
          zizmor-version: ${{ steps.tools.outputs.zizmor }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - docs
      - e2e-images
      - go-e2e
      - go-lint
      - go-test
      - go-vulncheck
      - helm-lint
      - helm-unittest
      - workflow-lint
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # cancelled counts as failed: !cancelled() above still runs this job when
      # individual needs were cancelled but the run was not, and a required job
      # that never reached a verdict must not clear the merge gate.
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
