---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: "v1.1.2"

jobs:
  docs:
    if: ${{ github.event_name != 'push' }}
    name: Docs
    uses: ./.github/workflows/docs.yaml
    permissions:
      contents: read
    with:
      deploy: false

  go-e2e:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go E2E (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # The legs are independent clusters on their own runners, so a failure in one
      # should not cost us the signal from the other.
      fail-fast: false
      matrix:
        include:
          # miroir's own Go specs, then the upstream external-storage suite, both
          # against the local (lvmthin, replicas:1) class.
          - suite: conformance
            testdriver: testdriver-local.yaml
            specs: "1"
            capacity: "true"
          # The upstream suite against the replicated (DRBD, replicas:2) class,
          # group snapshots included.
          - suite: replicated
            testdriver: testdriver.yaml
          - suite: zfs
            testdriver: testdriver-zfs.yaml
            capacity: "true"
          # Filesystem-only multi-node access through the NFS gateway. Keeping this
          # separate avoids advertising unsupported raw-block RWX.
          - suite: rwx
            testdriver: testdriver-rwx.yaml
            gateway: "true"
            capacity: "true"
            focus: "miroir.home-operations.com.*(ROX mode|concurrently access the single volume from pods on different node)"
          # Serial specs need exclusive use of their cluster. The focus keeps this
          # lane on upstream [Serial] coverage instead of replaying the parallel set.
          - suite: serial
            testdriver: testdriver.yaml
            procs: "1"
            focus: 'miroir.home-operations.com.*\[Serial\]'
            skip: '\[Disruptive\]|should not mount / map unused volumes'
    env:
      # Two names for one image in the runner-local registry. The nodes pull
      # registry.e2e, which the Talos mirror in patches/registry.yaml points at the
      # bridge gateway; buildx pushes to the same registry over loopback. The split
      # matters beyond taste: test.sh splits *_IMAGE on ':' for the Helm repo and
      # tag, so the host:port push form would parse wrong there.
      CONTROLLER_IMAGE: registry.e2e/miroir-controller:e2e
      AGENT_IMAGE: registry.e2e/miroir-agent:e2e
      GATEWAY_IMAGE: registry.e2e/miroir-gateway:e2e
      PUSH_CONTROLLER_IMAGE: localhost:5000/miroir-controller:e2e
      PUSH_AGENT_IMAGE: localhost:5000/miroir-agent:e2e
      PUSH_GATEWAY_IMAGE: localhost:5000/miroir-gateway:e2e
      # test.sh packages the chart, pushes it here, and installs it back over OCI, so
      # the run exercises the distributed artifact rather than the working tree.
      CHART_REGISTRY: oci://localhost:5000/charts
    defaults:
      run:
        working-directory: test/e2e-qemu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Resolve toolchain versions
        id: tools
        working-directory: .
        run: |
          echo "go=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"
          echo "talos=$(mise config get tools.talos)" >> "$GITHUB_OUTPUT"

      # Host prep is ours to do: the cluster action provisions and nothing else.
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Enable swap
        run: |
          sudo fallocate -l 12G /mnt/e2e-swapfile
          sudo chmod 600 /mnt/e2e-swapfile
          sudo mkswap /mnt/e2e-swapfile
          sudo swapon /mnt/e2e-swapfile

      # The conformance leg compiles and runs miroir's Go specs; both legs read the
      # module cache, only the conformance one uses it.
      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Start image registry
        run: docker run -d --name e2e-registry -p 5000:5000 registry:3

      # Booting the VMs and building the images share no inputs, so they overlap.
      # talosctl comes from mise, whose shim the action unwraps itself, because the
      # QEMU provisioner runs under sudo.
      - name: Create cluster
        id: cluster
        background: true
        uses: home-operations/talosctl-cluster-action@97d173e2efba3ec61abbfdf0fbd78ed848608190 # v0.1.4
        with:
          config: test/e2e-qemu/cluster.yaml

      # network=host so the builder container can reach the registry published on the
      # runner's loopback.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host

      # Both images are byte-identical across legs, so they share one cache scope per
      # image. Only one leg writes each back: concurrent cache-to writes to the same
      # scope evict each other, so the replicated leg writes and conformance reads.
      - name: Build controller image
        id: controller-image
        background: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          target: controller
          tags: ${{ env.PUSH_CONTROLLER_IMAGE }}
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha,scope=e2e-controller
          cache-to: ${{ matrix.suite == 'replicated' && 'type=gha,mode=max,scope=e2e-controller' || '' }}

      - name: Build agent image
        id: agent-image
        background: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          target: agent
          tags: ${{ env.PUSH_AGENT_IMAGE }}
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha,scope=e2e-agent
          cache-to: ${{ matrix.suite == 'replicated' && 'type=gha,mode=max,scope=e2e-agent' || '' }}

      # Gateway extends the agent stage, so buildx reuses it and only layers on
      # the ganesha packages.
      - name: Build gateway image
        id: gateway-image
        background: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          target: gateway
          tags: ${{ env.PUSH_GATEWAY_IMAGE }}
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha,scope=e2e-gateway
          cache-to: ${{ matrix.suite == 'replicated' && 'type=gha,mode=max,scope=e2e-gateway' || '' }}

      - wait: [cluster, controller-image, agent-image, gateway-image]

      - name: Cache conformance test binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/conformance/.bin
          key: conformance-bin-${{ steps.tools.outputs.talos }}

      - name: Run ${{ matrix.suite }} suite
        run: mise exec --locked --no-deps -- ./test.sh
        env:
          TESTDRIVER: ${{ matrix.testdriver }}
          RUN_SPECS: ${{ matrix.specs }}
          GATEWAY_ENABLED: ${{ matrix.gateway || 'false' }}
          STORAGE_CAPACITY_ENABLED: ${{ matrix.capacity || 'false' }}
          CLUSTER_NAME: ${{ steps.cluster.outputs.cluster-name }}
          ENDPOINT: ${{ steps.cluster.outputs.endpoint }}
          KUBECONFIG: ${{ steps.cluster.outputs.kubeconfig }}
          TALOSCONFIG: ${{ steps.cluster.outputs.talosconfig }}
          PROCS: ${{ matrix.procs || '4' }}
          FOCUS: ${{ matrix.focus }}
          SKIP: ${{ matrix.skip }}
          VERBOSE: "1"

      - name: Diagnostics
        if: failure()
        run: mise exec --locked --no-deps -- ./diagnostics.sh
        env:
          KUBECONFIG: ${{ steps.cluster.outputs.kubeconfig }}
          TALOSCONFIG: ${{ steps.cluster.outputs.talosconfig }}

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report-${{ matrix.suite }}
          path: test/conformance/report
          if-no-files-found: ignore

  go-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: ${{ runner.os }}-golangci-lint-

      - name: Run linter
        run: mise run lint

  go-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Go Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Running Unit Tests
        run: mise run test

      # envtest apiserver: the only place CRD structural schemas and CEL
      # validation rules are actually enforced.
      - name: Running Integration Tests
        run: mise run test-integration

      - name: Running CSI Sanity Tests
        run: mise run test-sanity

  helm-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Run helm lint
        run: mise run helm-lint

      - name: Check generated chart files are current
        run: mise run helm-docs-check

  helm-unittest:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Helm Unittest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          install_args: --locked

      - name: Run helm unit tests
        run: |-
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" --verify=false
          mise run helm-test

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - docs
      - go-e2e
      - go-lint
      - go-test
      - helm-lint
      - helm-unittest
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
